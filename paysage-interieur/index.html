<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ton paysage intérieur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout : carnet d'atelier en une colonne, une étape à la fois ; le paysage est esquissé vu du dessus, comme le tapis posé au sol */
:root{
  --bg:#ECEEE8; --surface:#F7F8F4; --line:#D3D8CF; --ink:#22302A; --muted:#5D6B63;
  --accent:#3F6B5C; --accent-soft:#DCE8E2; --gold:#C8902E;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161B19; --surface:#1E2522; --line:#34403A; --ink:#E6ECE6; --muted:#9CA9A1;
  --accent:#8CC4AE; --accent-soft:#25352F; --gold:#E2B456; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161B19; --surface:#1E2522; --line:#34403A; --ink:#E6ECE6; --muted:#9CA9A1;
  --accent:#8CC4AE; --accent-soft:#25352F; --gold:#E2B456; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1.4px);background-size:10px 10px}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.lede{color:var(--muted);max-width:62ch;margin:0}
.note{font-size:14px;color:var(--muted);margin:0}

nav.steps{display:flex;flex-wrap:wrap;gap:6px}
nav.steps button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.steps button .n{font-variant-numeric:tabular-nums;opacity:.7}
nav.steps button.done{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
nav.steps button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:26px}
.panel-head{display:flex;flex-direction:column;gap:8px}
.q{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.q legend,.q label.qt{font-weight:600;font-size:17px;padding:0;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],textarea{font:inherit;width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px}
textarea{min-height:90px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.scape{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:start}
@media (max-width:640px){.scape{grid-template-columns:1fr}}
.canvas-wrap{display:flex;flex-direction:column;gap:8px;align-items:center}
canvas{width:100%;max-width:340px;aspect-ratio:7/10;height:auto}
.rendubox{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:340px}
.rendubox img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.rugbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rugleg{display:flex;flex-direction:column;gap:4px;font-size:13px;max-width:340px;width:100%}
.rugleg span.sw2{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.layers{display:flex;flex-direction:column;gap:16px;min-width:0}
.layer{display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:14px}
.layer:last-child{border-bottom:0}
.layer .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.layer .val{font-family:var(--display);font-size:20px}
.layer .why{font-size:14px;color:var(--muted);margin:0}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details .chips{margin-top:8px}

.sw{display:flex;height:30px;border-radius:8px;overflow:hidden;max-width:340px;margin-top:4px}
.sw span{flex:1}
.palres{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:22px}
.palres .val{font-family:var(--display);font-size:24px}
.palres .why{font-size:14px;color:var(--muted);margin:0;max-width:60ch}
.portrait{display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--line);padding-top:26px}
.portrait .ptitle{font-size:clamp(24px,4.5vw,30px)}
.portrait section{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:14px;padding:18px 20px}
.portrait section h3{font-size:21px;line-height:1.25;text-wrap:balance}
.portrait p{margin:0;max-width:64ch}
.portrait section.plain{background:transparent;padding:0}
.portrait ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:64ch}
.portrait .soft{color:var(--muted);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:11px 22px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:14px;color:var(--accent);font-weight:600}
.poem{font-family:var(--display);font-size:clamp(19px,3.4vw,23px);line-height:1.4;margin:0;max-width:56ch;text-wrap:pretty}
.prompt-box textarea{min-height:190px;font-size:14.5px;line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">Atelier de tuftage · questionnaire</span>
    <h1>Ton paysage intérieur</h1>
    <p class="lede">Des questions sur qui tu es, pour dessiner le paysage de ton tapis : son relief, son eau, ses arbres, ses pierres, son ciel et ses couleurs. À la fin, tu peux tout ajuster et ajouter ce qui te tient à cœur.</p>
  </header>
  <nav class="steps" id="steps" aria-label="Étapes"></nav>
  <main id="main"></main>
</div>

<script src="moteur.js"></script>
<script>
/* ---------- Couches du paysage ---------- */
const LAYERS = {
  relief:{label:"Le relief",items:{
    plat:{fr:"Une plaine",why:"Tu as besoin d’espace et de calme, d’un sol où tout est à portée.",en:"a wide gentle plain"},
    doux:{fr:"Des collines douces",why:"Tu avances par élans et par pauses, en rondeur.",en:"soft rolling hills"},
    marque:{fr:"Des montagnes",why:"Tu as de l’énergie, de la force, et tu aimes les sommets.",en:"mountains with strong peaks"},
    volcan:{fr:"Un volcan",why:"Une chaleur intense couve à l’intérieur, protégée.",en:"a dormant volcano with a crater"},
    dunes:{fr:"Des dunes",why:"Tu vis par vagues, tu changes de forme avec le vent.",en:"wind-shaped dunes"},
    vallee:{fr:"Une vallée",why:"Tu as besoin d’un creux protégé, entouré de hauteurs.",en:"a sheltered valley between hills"}}},
  eau:{label:"L’eau",items:{
    source:{fr:"Une source",why:"Tes émotions sont précieuses et un peu cachées, on les découvre en s’approchant.",en:"a small hidden spring"},
    riviere:{fr:"Un fleuve qui serpente",why:"Tu relies, tu fais circuler, tu contournes les obstacles.",en:"a river meandering across"},
    lac:{fr:"Un lac",why:"Calme en surface, profond en dessous.",en:"a calm lake"},
    cascade:{fr:"Une cascade",why:"Tu fonces, tu as de l’élan, ça déborde parfois.",en:"a waterfall falling into a pool"},
    mer:{fr:"La mer",why:"Tu vis avec des marées, des hauts et des bas.",en:"the sea with waves along one edge"},
    ile:{fr:"Une île",why:"Tu as besoin d’être entouré·e d’eau pour te sentir protégé·e.",en:"an island surrounded by water"},
    aucune:{fr:"Pas d’eau",why:"",en:""}}},
  vegetation:{label:"La végétation",items:{
    arbre:{fr:"Un grand arbre",why:"Tes racines sont profondes, tu es un repère.",en:"one large solitary tree"},
    foret:{fr:"Une forêt",why:"Tu te sens bien entouré·e, dans le sauvage.",en:"a dense forest"},
    clairiere:{fr:"Une clairière",why:"Un coin à toi, protégé, qu’il faut savoir trouver.",en:"a clearing surrounded by trees"},
    prairie:{fr:"Une prairie",why:"Tu es ouvert·e, simple, avec plein de petites racines.",en:"a meadow of tall grass"},
    fleurs:{fr:"Des fleurs sauvages",why:"Tu sèmes, tu fais pousser, tu es libre.",en:"scattered wildflowers"},
    mousse:{fr:"De la mousse",why:"Tu es douceur, lenteur, tu adoucis ce qui est dur.",en:"soft patches of moss"},
    aucune:{fr:"Pas de végétation",why:"",en:""}}},
  mineral:{label:"La pierre",items:{
    galets:{fr:"Des galets",why:"Tu ramasses les petits souvenirs, les traces.",en:"smooth pebbles"},
    rochers:{fr:"Des rochers",why:"Tu es solide, un abri pour les autres.",en:"large boulders"},
    falaise:{fr:"Une falaise",why:"Tu as une force verticale, une limite claire.",en:"a rocky cliff along one side"},
    aucune:{fr:"Pas de pierre",why:"",en:""}}},
  ciel:{label:"Le ciel",items:{
    soleil:{fr:"Un soleil levant",why:"Tu es tourné·e vers les débuts, la lumière.",en:"a rising sun"},
    lune:{fr:"La lune",why:"Tu es intuitif·ve, tu aimes la nuit et ses cycles.",en:"a crescent moon"},
    etoiles:{fr:"Des étoiles",why:"Tu rêves loin, tu cherches des repères dans le noir.",en:"a scattering of stars"},
    brume:{fr:"La brume",why:"Tu aimes le flou, le mystère, l’entre-deux.",en:"drifting mist"},
    nuages:{fr:"Des nuages",why:"Tu es léger·ère, toujours en mouvement.",en:"soft clouds"},
    aucune:{fr:"Pas de ciel",why:"",en:""}}},
  chemin:{label:"Le chemin",items:{
    sentier:{fr:"Un sentier",why:"Tu cherches ton chemin, ou tu en traces un pour les autres.",en:"a winding footpath"},
    aucune:{fr:"Pas de chemin",why:"",en:""}}}
};
/* ---------- Palettes (4 saisons) ---------- */
const PALS={
  automne:{fr:"Automne chaleureux",c:["#E39A2E","#E8452C","#D6202A","#4A2220","#E57C78","#5E7A2B","#6A1F35","#2B2F45"],
    desc:"Des tons chauds et profonds : ocre, rouges, prune, vert olive. Réconfortants, avec un petit côté audacieux.",
    en:"warm deep autumn tones: ochre, tomato red, crimson, chocolate brown, coral pink, olive green, plum and midnight navy",
    frl:"tons chauds d’automne : ocre, rouge tomate, cramoisi, brun chocolat, rose corail, vert olive, prune et bleu nuit",
    scene:{ground:"#E7C79A",groundD:"#C9A06A",line:"#8A5A3A",water:"#5C6F8A",waterL:"#8EA0B8",waterD:"#2B2F45",green:"#5E7A2B",greenD:"#3F5520",stone:"#9A6B5A",stoneD:"#4A2220"},
    tufts:["#E39A2E","#E8452C","#E57C78","#6A1F35","#5E7A2B"]},
  ete:{fr:"Été doux",c:["#6E4A75","#C8284A","#C48BA7","#EBA7B4","#6E6656","#7D86A5","#3E4A7A"],
    desc:"Des tons froids et subtils : mauves, roses poudrés, bleus brumeux. Rien de criard, tout en nuance.",
    en:"soft cool summer tones: dusty violet, raspberry, mauve, powder pink, taupe, misty blue-grey and denim navy",
    frl:"tons doux et froids d’été : violet poudré, framboise, mauve, rose poudré, taupe, bleu-gris brumeux et bleu jean",
    scene:{ground:"#E6D3DD",groundD:"#C9A9BA",line:"#6E4A75",water:"#7D86A5",waterL:"#B3BBD4",waterD:"#3E4A7A",green:"#8E8A70",greenD:"#6E6656",stone:"#A79AA0",stoneD:"#6E6656"},
    tufts:["#C48BA7","#EBA7B4","#6E4A75","#7D86A5","#C8284A"]},
  printemps:{fr:"Printemps lumineux",c:["#F9C23C","#C9DB6E","#E9714E","#E3262E","#2AA6D6","#E9A3A6","#D3A9CF"],
    desc:"Des tons clairs et pleins de vie : jaune soleil, vert tendre, corail, bleu ciel. Légers et joyeux.",
    en:"bright clear spring tones: sunny yellow, lime green, coral, poppy red, sky blue, light pink and lilac",
    frl:"tons clairs de printemps : jaune soleil, vert tendre, corail, rouge coquelicot, bleu ciel, rose clair et lilas",
    scene:{ground:"#F6E7B8",groundD:"#E7CF85",line:"#C49A3A",water:"#2AA6D6",waterL:"#8FD3EC",waterD:"#1C7FA8",green:"#9DBF3E",greenD:"#6E9128",stone:"#E9A3A6",stoneD:"#C77C80"},
    tufts:["#F9C23C","#C9DB6E","#E9714E","#E9A3A6","#D3A9CF"]},
  hiver:{fr:"Hiver contrasté",c:["#DDE7EA","#C9D7DE","#F5C6CE","#F4C726","#E3194C","#D2262B","#2A1C3F","#4A1E5E","#1F1F1F"],
    desc:"Des couleurs franches, sans demi-mesure : blancs glacés, noir, violet profond, et quelques éclats vifs.",
    en:"high-contrast winter tones: icy white-blue, frost grey, ice pink, lemon yellow, fuchsia red, true red, ink navy, deep purple and black",
    frl:"tons contrastés d’hiver : blanc glacé, gris givre, rose glace, jaune citron, rouge fuchsia, rouge vif, bleu encre, violet profond et noir",
    scene:{ground:"#E9EEF0",groundD:"#C9D7DE",line:"#2A1C3F",water:"#9FB3C8",waterL:"#FFFFFF",waterD:"#2A1C3F",green:"#4A1E5E",greenD:"#1F1F1F",stone:"#9AA3AA",stoneD:"#2A1C3F"},
    tufts:["#F5C6CE","#E3194C","#4A1E5E","#F4C726","#2A1C3F"]}
};
function curPal(){
  if(S.palOv)return S.palOv;
  const n={};["c1","c2","c3","c4","c5","c6","c7","c8"].forEach(k=>{const o=opt(k);if(o)n[o.p]=(n[o.p]||0)+1;});
  const b=Object.entries(n).sort((x,y)=>y[1]-x[1])[0];return b?b[0]:null;
}
const itemLayer={};Object.entries(LAYERS).forEach(([L,o])=>Object.keys(o.items).forEach(k=>{if(k!=="aucune")itemLayer[k]=L;}));

/* ---------- Questions ---------- */
const STEPS=[
 {id:"toi",label:"Toi",title:"Pour commencer",intro:"Réponds au feeling. Il n’y a pas de bonne réponse, seulement la tienne.",qs:[
   {id:"prenom",type:"text",q:"Comment tu t’appelles ?",ph:"Ton prénom"}]},
 {id:"perso",label:"Qui tu es",title:"Qui tu es",intro:"Ta façon d’être avec les autres et avec toi-même. Choisis la réponse qui te ressemble le plus.",qs:[
   {id:"p1",q:"Dans un groupe d’ami·es, tu es souvent…",opts:[
     {fr:"celle ou celui sur qui on peut compter, un peu en retrait",w:{rochers:2,arbre:1}},
     {fr:"celle ou celui qui sent tout de suite comment chacun va",w:{lac:2,source:1}},
     {fr:"celle ou celui qui entraîne les autres",w:{marque:2,soleil:1}},
     {fr:"celle ou celui qui prend soin de tout le monde",w:{doux:2,prairie:1}},
     {fr:"dans ta bulle, la tête un peu ailleurs",w:{nuages:2,brume:1}},
     {fr:"celle ou celui qui propose toujours d’aller voir ailleurs",w:{sentier:2,dunes:1}}]},
   {id:"p2",q:"Face à un obstacle, tu…",opts:[
     {fr:"restes solide et attends que ça passe",w:{falaise:2,rochers:1}},
     {fr:"as besoin de le ressentir et d’en parler avant d’agir",w:{source:2,lac:1}},
     {fr:"fonces",w:{cascade:2,marque:1}},
     {fr:"cherches un terrain d’entente, en douceur",w:{doux:2,clairiere:1}},
     {fr:"imagines une solution à laquelle personne n’a pensé",w:{etoiles:2,lune:1}},
     {fr:"cherches un autre chemin",w:{sentier:3}}]},
   {id:"p3",q:"Ton rythme idéal",opts:[
     {fr:"lent et régulier",w:{plat:2,mousse:1}},
     {fr:"par vagues, avec des hauts et des bas",w:{mer:2,lac:1}},
     {fr:"intense, plein d’énergie",w:{volcan:2,marque:1}},
     {fr:"tranquille, avec du temps pour profiter",w:{doux:2,prairie:1}},
     {fr:"au gré de tes envies, sans horaires",w:{brume:2,vallee:1}},
     {fr:"toujours en mouvement, d’un endroit à l’autre",w:{dunes:2,sentier:1}}]},
   {id:"p4",q:"Tes émotions ressemblent plutôt à…",opts:[
     {fr:"un lac calme en surface, profond en dessous",w:{lac:3,plat:1}},
     {fr:"une source cachée, qu’on découvre en s’approchant",w:{source:3}},
     {fr:"un volcan qui dort",w:{volcan:3}},
     {fr:"une pluie douce qui fait tout pousser",w:{fleurs:2,prairie:1}},
     {fr:"une brume, difficile à saisir",w:{brume:3}},
     {fr:"un fleuve qui coule sans s’arrêter",w:{riviere:3,sentier:1}}]},
   {id:"p5",q:"Quand tout va trop vite, tu as besoin de…",opts:[
     {fr:"retrouver un lieu connu, du concret",w:{arbre:2,plat:1}},
     {fr:"te plonger dans l’eau",w:{mer:2,lac:1}},
     {fr:"te défouler, bouger fort",w:{cascade:2,marque:1}},
     {fr:"un plaid, un thé, quelqu’un de doux",w:{mousse:2,clairiere:1}},
     {fr:"t’allonger et regarder le ciel",w:{nuages:2,etoiles:1}},
     {fr:"marcher, partir un peu",w:{sentier:2,dunes:1}}]},
   {id:"p6",q:"Ce qui te fait te sentir protégé·e",opts:[
     {fr:"un rocher solide dans ton dos",w:{rochers:3}},
     {fr:"de l’eau tout autour de toi",w:{ile:4}},
     {fr:"une hauteur d’où tu vois tout venir",w:{marque:2,falaise:1}},
     {fr:"un nid, des bras qui t’entourent",w:{clairiere:2,doux:1}},
     {fr:"un creux loin du bruit, que personne ne connaît",w:{vallee:3}},
     {fr:"savoir que tu peux partir quand tu veux",w:{sentier:2,dunes:1}}]}
 ]},
 {id:"racines",label:"Tes racines",title:"Tes racines",intro:"Ce qui te nourrit, d’où tu viens, ce que tu laisses derrière toi.",qs:[
   {id:"r1",q:"Tes racines, c’est plutôt…",opts:[
     {fr:"un lieu, une famille, quelque chose de très ancré",w:{arbre:3}},
     {fr:"les liens du cœur, les émotions partagées",w:{source:2,lac:1}},
     {fr:"les défis que tu as relevés",w:{soleil:2,marque:1}},
     {fr:"un peu partout, plein de petites racines",w:{prairie:2,fleurs:1}},
     {fr:"les histoires et l’imaginaire qui t’ont nourri·e",w:{lune:2,etoiles:1}},
     {fr:"tu les cherches encore",w:{sentier:2,dunes:1}}]},
   {id:"r2",q:"Un souvenir de nature qui t’est resté",opts:[
     {fr:"une forêt",w:{foret:3,mousse:1}},
     {fr:"le bord de mer",w:{mer:2,galets:2}},
     {fr:"la montagne",w:{marque:2,falaise:1}},
     {fr:"un jardin en fleurs",w:{fleurs:3}},
     {fr:"une nuit à la belle étoile",w:{etoiles:3}},
     {fr:"le désert, le sable",w:{dunes:3}}]},
   {id:"r4",q:"Ce que tu laisses derrière toi",opts:[
     {fr:"quelque chose de solide, sur quoi construire",w:{rochers:2,arbre:1}},
     {fr:"des petites traces, des souvenirs ramassés",w:{galets:3}},
     {fr:"une impulsion, l’envie de se lancer",w:{soleil:2,cascade:1}},
     {fr:"des graines qui poussent après ton passage",w:{fleurs:2,prairie:1}},
     {fr:"un peu de mystère",w:{brume:2,lune:1}},
     {fr:"un chemin que d’autres peuvent suivre",w:{sentier:3}}]},
   {id:"r5",q:"Ton moment entre ciel et terre",opts:[

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt=id=>{const q=Q[id];return q&&q.opts&&S.a[id]!=null?q.opts[S.a[id]]:null;};

function scores(){
  const n={};
  Object.keys(Q).forEach(id=>{const o=opt(id);if(o&&o.w)for(const[k,v]of Object.entries(o.w))n[k]=(n[k]||0)+v;});
  return n;
}
const MIN={relief:1,eau:2,vegetation:2,mineral:2,ciel:2,chemin:3};
function compose(){
  const n=scores(),res={};
  for(const L of Object.keys(LAYERS)){
    if(S.ov[L]){res[L]=S.ov[L];continue;}
    let best=null,bv=0;
    for(const k of Object.keys(LAYERS[L].items)){if(k==="aucune")continue;const v=n[k]||0;if(v>bv){bv=v;best=k;}}
    res[L]=bv>=MIN[L]?best:(L==="relief"?"doux":"aucune");
  }
  return res;
}
function answeredCount(){return Object.keys(S.a).filter(k=>Q[k]&&Q[k].opts).length;}

/* ---------- Le tapis : réponses → réglages du moteur ---------- */
/* mode atelier (adresse terminée par #atelier) : légende technique, choix de l'ambiance et des couches pour tester.
   Côté client, le tapis est celui qui découle des réponses : rien à re-choisir. */
let ATELIER=location.hash==="#atelier";
addEventListener("hashchange",()=>{ATELIER=location.hash==="#atelier";render();});
const VIEW="atelier"; // la vue client est mise de côté : le rendu réaliste viendra d’un générateur d’images guidé par ce plan
const AMB={epure:"Épuré",mer:"Mer et plage",foret:"Forêt luxuriante",ciel:"Ciel et espace",montagne:"Montagne",lave:"Lave",desert:"Désert et canyon",jardin:"Jardin fleuri"};
const SIGOK={epure:["lune","soleil","rochers","falaise"],mer:["rochers","soleil"],foret:["sentier","soleil","lune"],jardin:["sentier","rochers","soleil","lune"],
  ciel:["lune","soleil","etoiles"],montagne:["sentier","soleil","lune"],lave:[],desert:["soleil","rochers","sentier"]};
/* l'ambiance : le thème que les réponses portent le plus */
function ambiance(){
  const c=compose(),sc=scores(),t3=opt("t3"),cand=[];
  if(c.eau==="mer"||c.eau==="ile")cand.push(["mer",sc[c.eau]||0]);
  if(c.relief==="volcan")cand.push(["lave",sc.volcan||0]);
  if(c.relief==="marque")cand.push(["montagne",sc.marque||0]);
  if(c.relief==="dunes"||c.relief==="vallee")cand.push(["desert",sc[c.relief]||0]);
  if(["lune","etoiles","nuages","brume"].includes(c.ciel))cand.push(["ciel",(sc[c.ciel]||0)*.9]);
  if(["foret","arbre","clairiere","mousse"].includes(c.vegetation))cand.push(["foret",sc[c.vegetation]||0]);
  if(["fleurs","prairie"].includes(c.vegetation))cand.push(["jardin",sc[c.vegetation]||0]);
  cand.sort((a,b)=>b[1]-a[1]);const top=cand[0]?cand[0][0]:"jardin";
  const auto=t3&&t3.d<.8?"epure":top;
  return {theme:(ATELIER&&S.amb)||auto,auto,tendance:top};
}
function rugParams(){
  const c=compose(),t4=opt("t4"),t3=opt("t3"),cx=opt("cx"),sc=scores(),A=ambiance();
  // un seul élément signature, compatible avec l'ambiance
  const ok=SIGOK[A.theme]||[],picked=k=>S.ov.chemin===k||S.ov.ciel===k||S.ov.mineral===k;
  const sigs=["sentier","soleil","lune","etoiles","rochers","falaise"].filter(k=>(c.chemin===k||c.ciel===k||c.mineral===k)&&ok.includes(k))
    .sort((a,b)=>(picked(b)?99:sc[b]||0)-(picked(a)?99:sc[a]||0));
  return {seed:(S.a.prenom||"").trim().toLowerCase()+"|"+JSON.stringify(S.a),v:S.rv||0,season:curPal()||"printemps",cx:cx?cx.cx:"nuance",
    shape:t4?{organic:"organique",round:"rond",rect:"rect"}[t4.shape]:"organique",
    dens:t3?(t3.d>1.2?"foisonnant":t3.d<.8?"epure":"equilibre"):"equilibre",
    relief:["lisse","doux","sculpte"][S.a.t1]||"doux",texture:["mousse","galet","ecorce","sable","eau"][S.a.t2]||"mousse",
    avoid:S.a.eviter||"",layers:c,theme:A.theme,tendance:A.tendance,signature:sigs[0]||null};
}

function afficheRendu(){const box=document.getElementById("rendubox");if(!box)return;const ici=RENDU.cle===cleRendu();
  if(RENDU.etat==="calcul"){box.innerHTML=`<span class="note">Rendu en cours dans Blender… ${Math.round((Date.now()-RENDU.t0)/1000)} s</span>`;return;}

async function rendreReel(qualite){if(RENDU.etat==="calcul")return;
  const q=rugParams(),g=Moteur.generate(q,8),m=Moteur.maps(g),b64=a=>{let s="";for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s);};
  RENDU={cle:JSON.stringify(q),img:null,etat:"calcul",t0:Date.now(),secondes:0};afficheRendu();
  try{const corps={qualite,vue:"dessus",largeur:70,hauteur:100,couleurs:b64(await png(m.col,m.w,m.h)),hauteurs:b64(await png(m.hei,m.w,m.h)),points:b64(await png(m.tec,m.w,m.h))};
    const r=await fetch("/rendu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corps)}),j=await r.json();
    if(!r.ok||!j.image)throw new Error(j.erreur||"Le rendu a échoué.");

function drawRug(){const cv=document.getElementById("cv");if(!cv||!window.Moteur)return;afficheRendu();

}

function poem(){
  const c=compose(),bits=[];
  const L=(k)=>c[k]!=="aucune"?LAYERS[k].items[c[k]].fr.toLowerCase():null;
  if(L("relief"))bits.push(L("relief"));
  if(L("eau"))bits.push(L("eau"));
  if(L("vegetation"))bits.push(L("vegetation"));
  if(L("mineral"))bits.push(L("mineral"));
  let s="Ton paysage, c’est "+bits.slice(0,-1).join(", ")+(bits.length>1?" et "+bits[bits.length-1]:bits[0]||"un espace encore à inventer");
  if(L("ciel"))s+=", sous "+L("ciel").replace(/^(un|une|des|la|le) /,m=>({"un ":"un ","une ":"une ","des ":"des ","la ":"la ","le ":"le "}[m]));
  if(L("chemin"))s+=", traversé par un sentier";
  return s+".";

function summary(){
  const c=compose(),out=["Questionnaire · Ton paysage intérieur"];
  if(S.a.prenom)out.push("Prénom : "+S.a.prenom);out.push("");
  STEPS.forEach(st=>{if(!st.qs)return;const rows=st.qs.filter(q=>S.a[q.id]!=null&&S.a[q.id]!=="").map(q=>q.q+" : "+(q.opts?q.opts[S.a[q.id]].fr:S.a[q.id]));if(rows.length&&st.id!=="toi"){out.push("— "+st.title.toUpperCase(),...rows,"");}});

}

      <div class="rugbar">${ATELIER?`<button type="button" class="chip" data-export>Exporter pour Blender</button>`:""}<button type="button" class="chip" data-rugv>Autre proposition</button></div><span class="toast" id="exptoast" aria-live="polite" style="text-align:center"></span>
      ${ATELIER?`<div class="rugbar" role="group" aria-label="Ambiance (mode atelier)"><span class="note" style="width:100%;text-align:center">Ambiance${S.amb?" choisie par toi":" déduite de tes réponses"} :</span>${Object.entries(AMB).map(([k,l])=>`<button type="button" class="chip" data-amb="${k}" aria-pressed="${ambiance().theme===k}">${l}</button>`).join("")}${S.amb?'<button type="button" class="chip" data-amb="">Revenir à l’automatique</button>':""}</div>`:""}
      <div class="rugleg" id="rugleg"></div></div>
    <div class="layers">${few?'<p class="note">Tu as répondu à peu de questions : le paysage est encore approximatif.</p>':""}${layers}</div></div>`;
}

const SEASON_ADJ={automne:"aux couleurs d’automne",ete:"aux couleurs d’été",printemps:"aux couleurs de printemps",hiver:"aux couleurs d’hiver"};
function fiche(){
  const n=scores();
  const fs=Object.entries(FORCES).map(([k,f])=>[k,f.items.reduce((s,i)=>s+(n[i]||0),0)]).sort((a,b)=>b[1]-a[1]);
  const pk=curPal(),name=(S.a.prenom||"").trim();
  const card=(eb,title,body)=>`<section><span class="eyebrow">${eb}</span>${title?`<h3>${title}</h3>`:""}${body}</section>`;
  const out=[];
  const has=fs[0][1]>0,k1=fs[0][0],k2=fs[1][1]>=3?fs[1][0]:null;
  if(has){
    out.push(card("Qui tu es",`Une personnalité ${FX[k1].adj}${pk?`, ${SEASON_ADJ[pk]}`:""}`,
      `<p>Tu es surtout guidé·e par ${FORCES[k1].name}${k2?`, et aussi par ${FORCES[k2].name}`:""}. ${FORCES[k1].txt}</p>${k2?`<p>${FORCES[k2].txt}</p>`:""}${pk?`<p>${SEASON[pk]}</p>`:""}`));
  }
  out.push(`<section class="plain"><span class="eyebrow">Le paysage où tu te sens bien</span><p>C’est l’endroit qui te ressemble, celui où tu reviens à toi. ${pk?`Ses couleurs : ${PALS[pk].frl.split(" : ")[1]}.`:""}</p>
    ${pk?`<div class="sw">${PALS[pk].c.map(c=>`<span style="background:${c}"></span>`).join("")}</div>`:""}</section>${renderScape(true)}`);
  if(has){
    const list=[...FX[k1].forces,...(k2?FX[k2].forces.slice(0,2):[])];
    out.push(card("Tes forces","",`<ul>${list.map(x=>`<li>${x}</li>`).join("")}</ul>`));
    const p5=opt("p5");
    out.push(card("Quand tu as besoin de te ressourcer","",`<p>${FX[k1].besoin}</p>${k2?`<p>${FX[k2].besoin}</p>`:""}${p5?`<p class="soft">Tu l’as dit toi-même : quand tout va trop vite, tu as besoin de ${p5.fr}.</p>`:""}`));
    out.push(card("Pour te recentrer","Ton paysage intérieur, à portée de main",
      `<p>On n’a pas toujours accès à la nature, ni à un lieu à soi, quand on en a besoin. Ton tapis est là pour ça : un morceau de ton paysage intérieur, chez toi, où tu peux venir t’asseoir, respirer et te retrouver.</p>
       <p>Pour toi, il aura ${FORCES[k1].tapis}${k2?`, avec ${FORCES[k2].tapis}`:""}.</p>
       <p class="soft"><strong>Un petit rituel pour toi :</strong> ${FX[k1].rituel}</p>`));
  }
  const aj=(S.a.ajout||"").trim(),av=(S.a.eviter||"").trim();
  if(aj||av)out.push(card("Ta touche","",`${aj?`<p>Ton détail : <strong>${esc(aj)}</strong>. On s’en inspirera pour un motif discret, stylisé dans l’esprit de ton paysage.</p>`:""}${av?`<p class="soft">Sans : ${esc(av)}.</p>`:""}`));
  return `<div class="portrait">${out.join("")}</div>`;
}
function renderPal(){
  const k=curPal();

  return `<div class="palres"><span class="eyebrow">${S.palOv?"Ta palette, choisie par toi":"Ta palette"}</span><span class="val">${P.fr}</span>
    <div class="sw">${P.c.map(c=>`<span style="background:${c}"></span>`).join("")}</div><p class="why">${P.desc}</p>
    <div class="chips" role="group" aria-label="Choisir une autre palette"><span class="note" style="align-self:center">Une autre te parle plus ?</span>
    ${Object.entries(PALS).map(([key,p])=>`<button type="button" class="chip" data-pal="${key}" aria-pressed="${k===key}">${p.fr}</button>`).join("")}</div></div>`;
}
let lang="fr";
function render(){
  renderSteps();window.__name=S.a.prenom||"";
  const st=STEPS[S.step],m=document.getElementById("main"),last=S.step===STEPS.length-1;
  const nav=`<div class="nav"><button type="button" class="btn" data-prev ${S.step===0?"disabled":""}>Retour</button>${last?'<button type="button" class="btn" data-reset>Recommencer</button>':`<button type="button" class="btn primary" data-next>${S.step===STEPS.length-2?"Voir ma fiche":"Continuer"}</button>`}</div>`;

      ${fiche()}
      ${ATELIER?`<div class="prompt-box q"><div class="row" style="justify-content:space-between"><span class="eyebrow">Prompt pour le générateur d’images</span>
        <div class="chips" role="group" aria-label="Langue du prompt"><button type="button" class="chip" data-lang="fr" aria-pressed="${lang==="fr"}">Français</button><button type="button" class="chip" data-lang="en" aria-pressed="${lang==="en"}">English</button></div></div>
        <textarea id="prompt" readonly>${esc(promptText(lang))}</textarea>
        <div class="row"><button type="button" class="btn primary" data-export>Exporter pour Blender</button><button type="button" class="btn" data-copy="prompt">Copier le prompt</button><button type="button" class="btn" data-copy="summary">Copier mes réponses</button><button type="button" class="btn" data-dl id="dlbtn" hidden>Enregistrer l’esquisse</button><span class="toast" id="toast" aria-live="polite"></span></div>
        <textarea id="summary" readonly hidden>${esc(summary())}</textarea></div>`:""}</section>${nav}`;
  }else{
    m.innerHTML=`<section class="panel"><div class="panel-head"><span class="eyebrow">Étape ${S.step+1} sur ${STEPS.length}</span><h2>${st.title}</h2><p class="lede">${st.intro}</p></div>${st.qs.map(renderQ).join("")}${st.colors?renderPal():""}</section>${nav}`;
  }

function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));save();render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
const keep=f=>{const y=window.scrollY;const open=[...document.querySelectorAll("details[open] .chip")].map(c=>c.dataset.layer);f();save();render();open.forEach(L=>{const el=document.querySelector(`.chip[data-layer="${L}"]`);if(el)el.closest("details").open=true;});window.scrollTo(0,y);};

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.go!==undefined)return go(+t.dataset.go);
  if(t.hasAttribute("data-next"))return go(S.step+1);
  if(t.hasAttribute("data-prev"))return go(S.step-1);
  if(t.dataset.q)return keep(()=>{const v=+t.dataset.v;if(S.a[t.dataset.q]===v)delete S.a[t.dataset.q];else S.a[t.dataset.q]=v;});
  if(t.dataset.layer)return keep(()=>{S.ov[t.dataset.layer]=t.dataset.item;});
  if(t.dataset.rendu){rendreReel(t.dataset.rendu);return;}
  if(t.hasAttribute("data-export")){exporterBlender();return;}
  if(t.hasAttribute("data-rugv"))return keep(()=>{S.rv=(S.rv||0)+1;});
  if(t.dataset.amb!==undefined)return keep(()=>{if(t.dataset.amb)S.amb=t.dataset.amb;else delete S.amb;});
  if(t.hasAttribute("data-dl")&&DL){const cv=document.getElementById("cv"),toast=document.getElementById("toast");
    cv.toBlob(blob=>{DL.save({filename:"esquisse-tapis"+((S.a.prenom||"").trim()?"-"+S.a.prenom.trim():"")+".png",data:blob})
      .then(()=>{toast.textContent="Esquisse enregistrée";setTimeout(()=>toast.textContent="",2500);})
      .catch(err=>{if(err&&err.code!=="declined")toast.textContent="Impossible d’enregistrer ici";});},"image/png");return;}
  if(t.dataset.pal)return keep(()=>{S.palOv=t.dataset.pal;});
  if(t.dataset.lang){lang=t.dataset.lang;return keep(()=>{});}
  if(t.dataset.copy){const ta=document.getElementById(t.dataset.copy),toast=document.getElementById("toast");
    const ok=()=>{toast.textContent=t.dataset.copy==="prompt"?"Prompt copié":"Réponses copiées";setTimeout(()=>toast.textContent="",2500);};
    const fb=()=>{ta.hidden=false;ta.select();toast.textContent="Texte sélectionné : fais Cmd/Ctrl + C";};
    try{navigator.clipboard.writeText(ta.value).then(ok,fb);}catch(err){fb();}return;}
  if(t.hasAttribute("data-reset")){
    if(t.dataset.confirm){S={step:0,a:{},ov:{}};save();render();}
    else{t.dataset.confirm="1";t.textContent="Sûr·e ? Tout effacer";setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;t.textContent="Recommencer";}},3000);}
  }
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.text;if(!k)return;if(e.target.value)S.a[k]=e.target.value;else delete S.a[k];save();});
let DL=null;
/* ---------- export pour Blender : un .zip à décompresser, puis double-clic sur « lancer-le-rendu.command » ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){const name=enc.encode(f.name),d=f.data,crc=crc32(d),exe=f.exec;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer),name,d);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,0x031E,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,name.length,true);
    ch.setUint32(38,((exe?0o100755:0o100644)<<16)>>>0,true);ch.setUint32(42,off,true);cen.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+d.length;}
  const cs=cen.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);
  end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:"application/zip"});}
const png=(rgba,w,h)=>new Promise(res=>{const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").putImageData(new ImageData(rgba,w,h),0,0);
  cv.toBlob(b=>b.arrayBuffer().then(a=>res(new Uint8Array(a))),"image/png");});
async function exporterBlender(){const toast=document.getElementById("exptoast")||document.getElementById("toast")||{set textContent(v){}};toast.textContent="Préparation de l’export…";
  try{const q=rugParams(),g=Moteur.generate(q,8),m=Moteur.maps(g),enc=new TextEncoder();
    const cv=document.createElement("canvas");Moteur.render(cv,g,"atelier");
    const plan=await new Promise(r=>cv.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),"image/png"));
    let script;try{script=new Uint8Array(await (await fetch("rendu/rendu_blender.py")).arrayBuffer());}catch(e){script=null;}
    if(!script||script.length<1000)throw new Error("script");
    const nom=((S.a.prenom||"tapis").trim().toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûùüÿñæœ-]+/g,"-")||"tapis");
    const lancer=`#!/bin/bash
# Double-clique sur ce fichier pour rendre ton tapis avec Blender.
cd "$(dirname "$0")"
B="/Applications/Blender.app/Contents/MacOS/Blender"
if [ ! -x "$B" ]; then echo "Blender est introuvable dans Applications. Installe-le depuis https://www.blender.org/download/ puis relance."; read -p "Entrée pour fermer"; exit 1; fi
echo "Rendu vu du dessus… (quelques minutes)"
"$B" -b -P rendu_blender.py -- "$PWD" "$PWD/rendu-dessus.png" 70 100 128 dessus 60000 | grep "RENDU"
open rendu-dessus.png
`;
    const lisez=`Tapis de ${S.a.prenom||"…"} · ${g.info.join(", ")}

1. Installe Blender (gratuit) : https://www.blender.org/download/
2. Décompresse ce dossier.
3. Double-clique sur « lancer-le-rendu.command ».
   La première fois, macOS peut le bloquer : clic droit > Ouvrir > Ouvrir.
4. L'image rendu-dessus.png s'ouvre à la fin.

Sans double-clic, dans le Terminal :
  cd ce-dossier
  /Applications/Blender.app/Contents/MacOS/Blender -b -P rendu_blender.py -- "$PWD" rendu.png 70 100 128 dessus 60000
`;
    const files=[{name:`${nom}/couleurs.png`,data:await png(m.col,m.w,m.h)},{name:`${nom}/hauteurs.png`,data:await png(m.hei,m.w,m.h)},{name:`${nom}/points.png`,data:await png(m.tec,m.w,m.h)},
      {name:`${nom}/plan-atelier.png`,data:plan},{name:`${nom}/reglages.json`,data:enc.encode(JSON.stringify(q,null,1))},{name:`${nom}/rendu_blender.py`,data:script},
      {name:`${nom}/lancer-le-rendu.command`,data:enc.encode(lancer),exec:true},{name:`${nom}/LISEZ-MOI.txt`,data:enc.encode(lisez)}];
    await (DL||DL_LOCAL).save({filename:`tapis-${nom}-blender.zip`,data:zip(files)});toast.textContent="Export enregistré : décompresse-le, puis double-clic sur « lancer-le-rendu.command »";
  }catch(e){toast.textContent=e&&e.code==="declined"?"":e&&e.message==="script"?"Impossible de joindre le script de rendu.":"Impossible d’exporter ici.";}}
render();
const DL_LOCAL={save:({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return Promise.resolve();}};
(async()=>{try{DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){DL=null;}
  if(!DL)DL=DL_LOCAL;
  const b=document.getElementById("dlbtn");if(b)b.hidden=!DL;})();
</script>
